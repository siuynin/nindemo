<!DOCTYPE html>
<html>
<head>
    <title>Test User Credit API</title>
</head>
<body>
    <div class="container">
        <h1>Test User Credit API - User ID 2</h1>
        <button onclick="testUserCredit()">Test Get User Credits</button>
        <button onclick="testDeductCredits()">Test Deduct Credits (50)</button>
        <div id="result"></div>
        <div id="deduct-result"></div>
    </div>

    <script>
        async function testUserCredit() {
            try {
                // Token thực tế cho user ID 2
                const token = '17|eDLk9Pr3HVnHvkLj1uHZdCw91EX8NVnG5Bxy3tDh754c7be7';
                
                const response = await fetch('http://127.0.0.1:8001/api/user/credits', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                
                document.getElementById('result').innerHTML = `
                    <h3>Kết quả:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p>Status: ${response.status}</p>
                    <p>Success: ${data.success}</p>
                    ${data.data ? `
                        <p>Total Credits: ${data.data.total_credits}</p>
                        <p>Used Credits: ${data.data.used_credits}</p>
                        <p>Remaining Credits: ${data.data.remaining_credits}</p>
                    ` : `<p>Error: ${data.message}</p>`}
                `;
                
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h3>Lỗi:</h3>
                    <p>${error.message}</p>
                `;
            }
        }

        // Test với userCreditService

    </script>
</body>
</html>
